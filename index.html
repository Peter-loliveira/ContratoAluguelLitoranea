<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de Contrato de Locação · RE/MAX Litorânea</title>
<style>
:root{--red:#DC1C2E;--blue:#003DA5;--ink:#1d2433;--mut:#5d6677;--line:#dde2ea;--bg:#f2f4f8}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:5px solid var(--red);box-shadow:0 2px 0 var(--blue)}
.hd{max-width:1000px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:18px}
.hd img{height:46px}.hd h1{font-size:20px;margin:0;color:var(--blue)}.hd p{margin:2px 0 0;color:var(--mut);font-size:13px}
main{max-width:1000px;margin:20px auto 110px;padding:0 16px;counter-reset:s}
section,details{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:16px;padding:18px 20px}
.sec>summary{font-size:16px;color:var(--blue);display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;list-style:none;user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{counter-increment:s;content:counter(s);background:var(--red);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.sec>summary::after{content:"▸";margin-left:auto;color:var(--red);font-size:18px;transition:transform .15s}
.sec[open]>summary::after{transform:rotate(90deg)}
.sec[open]>summary{margin-bottom:14px}
.party>summary{cursor:pointer;font-weight:700;color:var(--blue)}.party>summary .x{float:right}.party[open]>summary{margin-bottom:10px}
.conta{align-items:end;margin-bottom:8px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input[type=file]{display:none}
#imp{background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:14px}#imp[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:#39435a}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
input,select,textarea{font:inherit;font-weight:400;color:var(--ink);padding:9px 10px;border:1px solid #c5ccd8;border-radius:6px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.err{border-color:var(--red)!important;background:#fff4f5!important}
.chk{flex-direction:row;align-items:center;gap:8px;font-weight:500;padding-top:22px}.chk input{width:auto}
small{font-weight:400;color:var(--mut);font-size:12px;min-height:15px}
.end{background:#eef3fc;border:1px solid #c9d7f2;border-radius:6px;padding:9px 10px;color:var(--blue);font-weight:700;min-height:40px;display:flex;align-items:center}
details.party{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:12px 14px;margin-bottom:12px;background:#fafbfd}
.btn{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.red{background:var(--red);color:#fff}.red:hover{background:#b9111f}.line{background:#fff;color:var(--blue);border:2px solid var(--blue)}.line:hover{background:#eef3fc}
.x{background:none;border:0;color:var(--red);cursor:pointer;font:inherit;font-size:13px;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:4px solid var(--blue);padding:12px 16px;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
#msg{font-size:14px;font-weight:600}#msg.bad{color:var(--red)}#msg.ok{color:#0a7a3d}
@media(max-width:720px){.f{grid-column:span 12!important}.chk{padding-top:0}}
</style></head><body>
